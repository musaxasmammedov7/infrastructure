# Diagrams per subscription (one environment = one subscription).
# One entry = one diagram; "/" in the name = sub-folder in diagrams/.
#   merge:        same structure -> ONE template diagram, names use <env>, "only in" marks differences
#   side_by_side: subscriptions drawn as they are
# Subscriptions not listed here are drawn on subscriptions/other.
pages:
  - name: subscriptions/non-prod
    merge: [Development, QA, Staging, Demo, Integration]
  - name: subscriptions/production
    side_by_side: [Production]
  - name: subscriptions/shared
    side_by_side: [Shared]
