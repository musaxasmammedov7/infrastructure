name: azure-diagrams

# Weekly snapshot of Azure -> diff -> Mermaid diagrams -> commit.
# Azure access is READ-ONLY (Reader role, OIDC login, no stored password).
on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch: {}   # manual "Run workflow" button

permissions:
  id-token: write   # lets GitHub issue the short-lived OIDC token for Azure login
  contents: write   # lets the job commit snapshots/diagrams to this repo

concurrency:
  group: azure-diagrams
  cancel-in-progress: false

env:
  # "true" only for a personal test subscription.
  # Set to "false" in the organization repository.
  ALLOW_PUBLIC_REPO: "true"

jobs:
  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse to run in a public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$ALLOW_PUBLIC_REPO" != "true" ] && [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" != "true" ]; then
            echo "::error::Repository is public. Snapshots contain IPs, open ports and who changed what. Make the repository private first."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Azure login (OIDC, read-only identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Collect (Azure Resource Graph, read-only)
        run: python3 scripts/collect.py

      - name: Diff with previous snapshot
        run: python3 scripts/diff.py

      - name: Render diagrams (.drawio)
        run: python3 scripts/render.py >> "$GITHUB_STEP_SUMMARY"

      - name: Install draw.io desktop (for export)
        run: |
          curl -sSfL -o /tmp/drawio.deb \
            https://github.com/jgraph/drawio-desktop/releases/download/v24.7.17/drawio-amd64-24.7.17.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb /tmp/drawio.deb

      - name: Export PNG
        run: |
          # draw.io needs absolute paths and exits 0 even on errors, so check the output files.
          for f in "$GITHUB_WORKSPACE"/build/*.drawio; do
            png="$GITHUB_WORKSPACE/diagrams/$(basename "${f%.drawio}").png"
            xvfb-run -a drawio -x -f png --scale 1.5 -b 10 -o "$png" "$f" --no-sandbox --disable-gpu 2>&1 | grep -v bus.cc || true
            test -s "$png" || { echo "::error::export failed for $f"; exit 1; }
          done
          # explainer diagram in docs/ (source .drawio is committed, PNG is exported)
          xvfb-run -a drawio -x -f png --scale 1.5 -b 10 -o "$GITHUB_WORKSPACE/docs/how-it-works.png" \
            "$GITHUB_WORKSPACE/docs/how-it-works.drawio" --no-sandbox --disable-gpu 2>&1 | grep -v bus.cc || true
          ls -la diagrams docs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots changes diagrams docs
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "diagrams: $(date -u +%F)"
            # someone may have pushed while we ran: replay our generated files on top (ours win)
            git pull --rebase -X theirs origin main
            git push
          fi
